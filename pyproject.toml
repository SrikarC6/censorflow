[project]
name = "censorflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Srikar Chitturi", email = "64421927+SrikarC6@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "mlx-audio-separator>=0.1.20 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "mutagen>=1.48.1",
    "numpy>=2.4.6",
    "parakeet-mlx>=0.5.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"
